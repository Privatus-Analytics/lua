# Conformance example app for lua-resty-privatus (OpenResty).
# Built by the conformance suite (https://github.com/Privatus-Analytics/conformance).
# See its CONTRACT.md for what each route must render.
env PRIVATUS_SITE_ID;
env PRIVATUS_SCRIPT_HOST;

daemon off;
worker_processes 2;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  default_type text/html;
  lua_package_path "/app/?.lua;;";

  init_by_lua_block {
    -- Forced on, so the tag prints whatever the environment. The site id
    -- and script host come from the environment. Auto inject is off here
    -- and on for /auto only, so the other routes test the helper alone.
    require("resty.privatus").configure({ enabled = true, auto_inject = false, nonce = "testnonce" })
  }

  server {
    listen 8080;

    location = / { content_by_lua_block { require("pages").serve("home") } }
    location = /event { content_by_lua_block { require("pages").serve("event") } }
    location = /nasty { content_by_lua_block { require("pages").serve("nasty") } }
    location = /off { content_by_lua_block { require("pages").serve("off") } }
    location = /off-plain { content_by_lua_block { require("pages").serve("off_plain") } }

    location = /auto {
      header_filter_by_lua_block { require("resty.privatus").header_filter({ auto_inject = true }) }
      body_filter_by_lua_block { require("resty.privatus").body_filter() }
      content_by_lua_block { require("pages").serve("auto") }
    }

    location / { return 404; }
  }
}
