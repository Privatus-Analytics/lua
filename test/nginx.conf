# Test server for test/integration.sh. Shows the setup from the README.
env PRIVATUS_SITE_ID;
env PRIVATUS_ENV;

worker_processes 1;
error_log /tmp/privatus-test/error.log warn;
pid /tmp/privatus-test/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;
  client_body_temp_path /tmp/privatus-test;
  proxy_temp_path /tmp/privatus-test;
  fastcgi_temp_path /tmp/privatus-test;
  uwsgi_temp_path /tmp/privatus-test;
  scgi_temp_path /tmp/privatus-test;
  default_type text/html;
  lua_package_path "/app/lib/?.lua;;";

  init_by_lua_block {
    require("resty.privatus").configure({
      modules = { "engage", "auto" },
      props = function(request) return { plan = request.ctx.plan } end,
      nonce = function(request) return request.ctx.nonce end,
    })
  }

  header_filter_by_lua_block { require("resty.privatus").header_filter() }
  body_filter_by_lua_block { require("resty.privatus").body_filter() }

  server {
    listen 8080;
    root /app/test/html;

    # A page sent in three chunks, with </head> split across two of them.
    location = /chunked {
      content_by_lua_block {
        ngx.ctx.plan = "pro"
        ngx.ctx.nonce = "n0nce"
        ngx.print("<html><he")
        ngx.flush(true)
        ngx.print("ad><title>x</title></HE")
        ngx.flush(true)
        ngx.print("AD><body>hi</body></html>")
      }
    }

    location = /json {
      default_type application/json;
      return 200 '{"head":"</head>"}';
    }

    location = /encoded {
      content_by_lua_block {
        ngx.header["Content-Encoding"] = "br"
        ngx.print("<html><head></head></html>")
      }
    }

    location = /already {
      return 200 '<html><head><script defer src="https://privatusstats.com/js/pa.js" data-site="pa_OTHER"></script></head></html>';
    }

    location = /missing {
      content_by_lua_block {
        ngx.status = 404
        ngx.print("<html><head></head><body>Not found</body></html>")
      }
    }

    location = /nohead {
      return 200 '<p>No head here</p>';
    }

    location = /off {
      header_filter_by_lua_block { require("resty.privatus").header_filter({ enabled = false }) }
      body_filter_by_lua_block { require("resty.privatus").body_filter() }
      return 200 '<html><head></head></html>';
    }

    location = /big {
      header_filter_by_lua_block { require("resty.privatus").header_filter({ max_buffer_size = 64 }) }
      body_filter_by_lua_block { require("resty.privatus").body_filter() }
      content_by_lua_block {
        ngx.print("<html><head></head><body>")
        ngx.flush(true)
        ngx.print(string.rep("x", 200))
        ngx.print("</body></html>")
      }
    }
  }
}
