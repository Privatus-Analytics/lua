name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install busted
      - run: luarocks install etlua
      - run: busted -o utfTerminal
      - run: lua test/smoke.lua

  # The luarocks.org manifest now has more constants than LuaJIT can load,
  # so luarocks runs on PUC Lua 5.1 and the tests run under LuaJIT 2.1.
  luajit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luarocks install busted
      - run: luarocks install etlua
      - run: luajit -v
      - run: busted --lua=luajit -o utfTerminal
      - run: luajit -e 'assert(jit, "not LuaJIT")' && luajit test/smoke.lua

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck
      - run: luacheck .

  openresty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./run-docker.sh
